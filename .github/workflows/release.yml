name: Build and publish firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e crossing-controller

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp .pio/build/crossing-controller/firmware.bin \
             release-assets/crossing-controller.bin

      - name: Generate manifest
        env:
          ASSET_DIR: release-assets
        run: python scripts/generate_manifest.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
