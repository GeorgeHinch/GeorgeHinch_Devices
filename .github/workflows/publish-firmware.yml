name: Publish firmware release

on:
  push:
    tags:
      - 'audio_sensor/v*'
      - 'motor_controller/v*'
      - 'triple_audio_player/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release contents and hash
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          device="${tag%%/v*}"
          version="${tag#*/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          case "$device" in
            audio_sensor)
              manifest_type="audio-sensor"
              display_name="Audio Sensor"
              hardware_revision="2"
              ;;
            motor_controller)
              manifest_type="motor-controller"
              display_name="Motor Controller"
              hardware_revision="1"
              ;;
            triple_audio_player)
              manifest_type="triple-audio-player"
              display_name="Triple Audio Player"
              hardware_revision="1"
              ;;
            *)
              echo "Unsupported firmware device: $device" >&2
              exit 1
              ;;
          esac

          release="firmware/${device}/v${version}"
          expected_sketch="${device}_${version//./_}.ino"
          sketch="$release/$expected_sketch"
          test -f "$sketch"
          binary="$release/${expected_sketch%.ino}.bin"
          test -f "$binary"
          test -f "$release/BUILD_INFO.md"

          hash="$(sha256sum "$binary" | awk '{print tolower($1)}')"
          grep -qi "$hash" "$release/BUILD_INFO.md"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "manifest_type=$manifest_type" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
          echo "hardware_revision=$hardware_revision" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Package release
        shell: bash
        env:
          RELEASE: ${{ steps.validate.outputs.release }}
          VERSION: ${{ steps.validate.outputs.version }}
          DEVICE: ${{ steps.validate.outputs.device }}
          MANIFEST_TYPE: ${{ steps.validate.outputs.manifest_type }}
          HARDWARE_REVISION: ${{ steps.validate.outputs.hardware_revision }}
          BINARY: ${{ steps.validate.outputs.binary }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "$BINARY" release-assets/
          if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" \
              -o release-assets/base-manifest.json; then
            echo "Carrying forward existing device entries"
          else
            rm -f release-assets/base-manifest.json
          fi
          FIRMWARE_VERSION="$VERSION" \
          DEVICE_TYPE="$MANIFEST_TYPE" \
          HARDWARE_TARGET="esp32-c3" \
          MINIMUM_HARDWARE_REVISION="$HARDWARE_REVISION" \
          BASE_MANIFEST=release-assets/base-manifest.json \
          ASSET_DIR=release-assets \
          python scripts/generate_manifest.py
          rm -f release-assets/base-manifest.json
          test -f release-assets/manifest.json
          grep -q "\"$MANIFEST_TYPE\"" release-assets/manifest.json
          zip -r "${DEVICE}_v${VERSION}.zip" "$RELEASE"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.validate.outputs.version }}
          DEVICE: ${{ steps.validate.outputs.device }}
          DISPLAY_NAME: ${{ steps.validate.outputs.display_name }}
          BINARY: ${{ steps.validate.outputs.binary }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${DEVICE}_v${VERSION}.zip" \
            release-assets/* \
            --title "${DISPLAY_NAME} v${VERSION}" \
            --generate-notes
